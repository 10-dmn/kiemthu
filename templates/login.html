{% extends "base.html" %}
{% block title %}Đăng nhập - Quản lý Hồ sơ Sinh viên{% endblock %}
{% block content %}
<div class="login-wrapper">
  <div class="login-panel">
    <div class="login-header">
      <div class="login-eyebrow">Hệ thống Quản lý Sinh viên</div>
      <h2 class="login-title">Đăng nhập Quản trị</h2>
      <p class="login-desc">Nhập thông tin xác thực để truy cập bảng điều khiển hệ thống</p>
    </div>

    <form method="post" action="{{ url_for('login') }}" class="login-form">
      <div class="form-field">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" placeholder="Nhập username" required autofocus autocomplete="username">
      </div>

      <div class="form-field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
    </form>

    <div class="login-footnote">
      <span>Tài khoản thử nghiệm:</span>
      <code>admin</code> / <code>admin123</code>
    </div>
  </div>
</div>
{% endblock %}
